<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustration pédagogique : télécharger AltStore PAL depuis le navigateur</title>
  <desc id="desc">Une page de téléchargement ouverte dans un navigateur, avec un bouton Download et une flèche vers un appareil mobile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f1"/>
      <stop offset="1" stop-color="#e8eee7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#214c40"/>
      <stop offset="1" stop-color="#376a51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#18352b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1110" cy="105" r="150" fill="#dbe8da" opacity=".72"/>
  <circle cx="115" cy="615" r="115" fill="#e0eadd" opacity=".75"/>
  <rect x="70" y="62" width="1140" height="596" rx="30" fill="#fff" filter="url(#shadow)"/>
  <text x="128" y="142" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2.5" fill="#547162">ÉTAPE 02 · TÉLÉCHARGEMENT</text>
  <text x="128" y="190" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" fill="#1b3027">Reste dans ton navigateur</text>
  <text x="128" y="226" font-family="Inter,Arial,sans-serif" font-size="19" fill="#68776f">Ouvre le site officiel, puis lance le téléchargement de PAL.</text>
  <g transform="translate(125 276)">
    <rect width="690" height="300" rx="22" fill="#f8faf7" stroke="#d9e2d8" stroke-width="2"/>
    <path d="M0 22a22 22 0 0 1 22-22h646a22 22 0 0 1 22 22v38H0z" fill="#edf2ec"/>
    <circle cx="30" cy="30" r="7" fill="#d38b7c"/>
    <circle cx="54" cy="30" r="7" fill="#d7b865"/>
    <circle cx="78" cy="30" r="7" fill="#8caf8e"/>
    <rect x="136" y="15" width="420" height="30" rx="15" fill="#fff" stroke="#dce4db"/>
    <text x="164" y="35" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64766a">altstore.io/download</text>
    <circle cx="72" cy="151" r="35" fill="#e6eee5"/>
    <path d="M56 151h32M72 135v32M61 140l22 22M83 140l-22 22" stroke="#376a51" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="137" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750" fill="#20392e">AltStore PAL</text>
    <text x="128" y="170" font-family="Inter,Arial,sans-serif" font-size="16" fill="#718078">Page officielle dans Safari, Chrome ou Vivaldi</text>
    <rect x="128" y="200" width="190" height="56" rx="14" fill="url(#green)"/>
    <text x="223" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">Download</text>
  </g>
  <path d="M845 425h95" stroke="#7b9b81" stroke-width="6" stroke-linecap="round"/>
  <path d="m922 406 21 19-21 19" fill="none" stroke="#7b9b81" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(970 285)">
    <rect width="160" height="270" rx="28" fill="#1e332b"/>
    <rect x="9" y="10" width="142" height="248" rx="21" fill="#f7faf6"/>
    <rect x="55" y="19" width="50" height="7" rx="4" fill="#bac8bc"/>
    <circle cx="80" cy="108" r="40" fill="#e1eee0"/>
    <path d="M80 82v48m-18-18 18 18 18-18" fill="none" stroke="#35684f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="174" width="80" height="8" rx="4" fill="#d3ded3"/>
    <rect x="51" y="192" width="58" height="7" rx="4" fill="#e1e8e0"/>
    <rect x="55" y="226" width="50" height="5" rx="3" fill="#d9e2d8"/>
  </g>
  <text x="1050" y="593" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#547162">ILLUSTRATION, PAS CAPTURE</text>
